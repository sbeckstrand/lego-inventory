name: Build and Push Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out the repo
      uses: actions/checkout@v2

    - name: Set short SHA
      id: short-sha
      run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        # The Dockerfile and app source live in backend/, so the build
        # context is ./backend (the Dockerfile does `COPY . .`).
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/lego-inventory:${{ env.SHORT_SHA }}

  update-image-tag:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Set short SHA
      id: short-sha
      run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

    - name: Checkout k8s-apps Repository
      uses: actions/checkout@v3
      with:
        repository: sbeckstrand/k8s-apps
        path: k8s-apps
        ref: main
        token: ${{ secrets.K8S_APPS_PAT }}

    - name: Update Image Tag
      run: |
        sed -i "s/tag: \".*\"/tag: \"${{ env.SHORT_SHA }}\"/" k8s-apps/apps/services/lego-inventory/values-image.yaml

    - name: Commit and Push Changes
      run: |
        cd k8s-apps
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add apps/services/lego-inventory/values-image.yaml
        git commit -m "Update lego-inventory image tag to ${{ env.SHORT_SHA }}"
        git push
